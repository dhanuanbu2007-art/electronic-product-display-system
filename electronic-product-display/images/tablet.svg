<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tab-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-tab)" rx="20"/>
  <g transform="translate(60, 50)">
    <!-- Tablet Frame -->
    <rect x="0" y="0" width="280" height="200" rx="20" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <!-- Screen -->
    <rect x="10" y="10" width="260" height="180" rx="12" fill="url(#tab-screen)"/>
    <!-- Stylus Pen -->
    <rect x="20" y="220" width="240" height="12" rx="6" fill="#e2e8f0"/>
    <path d="M 260 220 L 275 226 L 260 232 Z" fill="#94a3b8"/>
    <!-- Display Graphics -->
    <path d="M 30 140 Q 90 70 150 120 T 250 80" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.6"/>
  </g>
</svg>
