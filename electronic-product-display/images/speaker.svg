<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-spk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="spk-cone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-spk)" rx="20"/>
  <g transform="translate(100, 50)">
    <!-- Speaker Cabinet -->
    <rect x="0" y="0" width="200" height="300" rx="30" fill="#1e293b" stroke="#22c55e" stroke-width="4"/>
    <!-- Top Tweeter Speaker -->
    <circle cx="100" cy="80" r="35" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <circle cx="100" cy="80" r="20" fill="url(#spk-cone)"/>
    <!-- Main Woofer Speaker -->
    <circle cx="100" cy="200" r="65" fill="#0f172a" stroke="#475569" stroke-width="4"/>
    <circle cx="100" cy="200" r="48" fill="url(#spk-cone)"/>
    <circle cx="100" cy="200" r="22" fill="#020617"/>
    <!-- Soundwaves graphic -->
    <path d="M -30 200 Q -50 170 -30 140" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 230 200 Q 250 170 230 140" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
