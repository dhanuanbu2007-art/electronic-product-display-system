<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sw-dial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-sw)" rx="20"/>
  <g transform="translate(130, 40)">
    <!-- Watch Straps -->
    <rect x="35" y="0" width="70" height="320" rx="15" fill="#334155"/>
    <!-- Watch Body -->
    <rect x="10" y="80" width="120" height="160" rx="36" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <!-- Screen -->
    <rect x="20" y="90" width="100" height="140" rx="28" fill="#020617"/>
    <!-- UI graphics -->
    <circle cx="70" cy="160" r="45" fill="none" stroke="url(#sw-dial)" stroke-width="6" stroke-dasharray="200" stroke-dashoffset="40"/>
    <text x="70" y="155" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20">10:42</text>
    <text x="70" y="175" text-anchor="middle" fill="#d946ef" font-family="sans-serif" font-size="12">8,420 steps</text>
    <!-- Digital crown button -->
    <rect x="130" y="130" width="10" height="26" rx="4" fill="#94a3b8"/>
  </g>
</svg>
