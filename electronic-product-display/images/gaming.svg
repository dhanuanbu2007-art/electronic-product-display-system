<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rgb-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-gm)" rx="20"/>
  <g transform="translate(120, 50)">
    <!-- Gaming Mouse Base -->
    <path d="M 80 0 C 140 0, 160 80, 160 180 C 160 260, 120 300, 80 300 C 40 300, 0 260, 0 180 C 0 80, 20 0, 80 0 Z" fill="#1e1b4b" stroke="url(#rgb-glow)" stroke-width="4"/>
    <!-- Scroll Wheel -->
    <rect x="73" y="40" width="14" height="35" rx="7" fill="#020617" stroke="url(#rgb-glow)" stroke-width="2"/>
    <!-- RGB Strip Divider -->
    <path d="M 80 0 L 80 110" stroke="#a855f7" stroke-width="2"/>
    <!-- Palm Logo Light -->
    <polygon points="80,190 95,220 65,220" fill="url(#rgb-glow)"/>
  </g>
</svg>
