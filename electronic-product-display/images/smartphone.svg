<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg-glow)" rx="20"/>
  <g filter="url(#shadow)" transform="translate(110, 40)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="180" height="320" rx="30" fill="url(#body-grad)" stroke="#475569" stroke-width="4"/>
    <!-- Inner Screen Bezel -->
    <rect x="8" y="8" width="164" height="304" rx="22" fill="#020617"/>
    <!-- Screen Display -->
    <rect x="12" y="12" width="156" height="296" rx="18" fill="url(#screen-grad)"/>
    <!-- Dynamic Island / Notch -->
    <rect x="62" y="18" width="56" height="12" rx="6" fill="#000000"/>
    <!-- Screen Graphic UI overlay -->
    <circle cx="90" cy="140" r="40" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
    <circle cx="90" cy="140" r="25" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <path d="M 60 220 H 120 M 60 235 H 100 M 60 250 H 110" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <!-- Reflection highlight -->
    <path d="M 12 12 L 100 12 L 12 180 Z" fill="#ffffff" opacity="0.1"/>
  </g>
</svg>
