<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-laptop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="laptop-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-laptop)" rx="20"/>
  <g transform="translate(50, 70)">
    <!-- Screen Shell -->
    <rect x="30" y="0" width="240" height="170" rx="12" fill="#27272a" stroke="#52525b" stroke-width="3"/>
    <!-- Inner Screen -->
    <rect x="38" y="8" width="224" height="154" rx="6" fill="url(#laptop-screen)"/>
    <!-- Web Camera -->
    <circle cx="150" cy="4" r="2.5" fill="#a1a1aa"/>
    <!-- Laptop Display Content graphics -->
    <rect x="50" y="25" width="100" height="60" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="160" y="25" width="90" height="25" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="160" y="58" width="90" height="27" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="50" y="95" width="200" height="50" rx="4" fill="#ffffff" opacity="0.15"/>
    <!-- Laptop Base Hinge & Keyboard Body -->
    <path d="M 0 170 L 300 170 L 320 195 C 320 200 315 205 305 205 L -5 205 C -15 205 -20 200 -20 195 Z" fill="#3f3f46" stroke="#71717a" stroke-width="2"/>
    <!-- Trackpad -->
    <rect x="110" y="180" width="80" height="20" rx="3" fill="#27272a" stroke="#52525b" stroke-width="1"/>
    <!-- Keyboard area line -->
    <rect x="25" y="173" width="250" height="4" rx="2" fill="#18181b"/>
  </g>
</svg>
